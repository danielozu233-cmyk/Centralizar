<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPANA Cloud Hub — Enterprise Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v10.12.2) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            OAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKRB49LOhaR79NI8CwypqCMf_10GHd77k",
            authDomain: "reports-e956a.firebaseapp.com",
            projectId: "reports-e956a",
            storageBucket: "reports-e956a.firebasestorage.app",
            messagingSenderId: "1058914487818",
            appId: "1:1058914487818:web:ef0e53d4a400cb85a199f3",
            measurementId: "G-XB6QQR984G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const provider = new OAuthProvider("microsoft.com");
        provider.setCustomParameters({
            tenant: "b13b704f-c405-40bf-bdd1-2f2e151a21b0"
        });

        window.auth = auth;
        window.db = db;
        window.provider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f2f6;
            color: #111827;
        }
        .apple-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
        .apple-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px -10px rgba(0, 0, 0, 0.08);
            border-color: rgba(37, 99, 235, 0.3);
        }
        /* Scrollbar limpio */
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- ================= VISTA DE LOGIN ================= -->
    <div id="loginView" class="fixed inset-0 bg-[#f1f2f6] z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:20px_20px] opacity-40"></div>
        
        <div class="relative apple-glass border border-white/80 rounded-3xl shadow-[0_25px_70px_rgba(0,0,0,0.08)] max-w-md w-full p-10 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-700 text-white text-3xl mb-6 shadow-xl shadow-blue-600/20">
                <i class="fa-solid fa-compass-drafting"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-slate-900">UPANA Hub</h1>
            <p class="text-sm text-slate-500 mt-2 mb-8">Centralizador Institucional de Recursos</p>
            
            <div id="loginError" class="hidden text-xs text-red-600 font-medium mb-5 bg-red-50 border border-red-100 p-3 rounded-xl text-left"></div>

            <button onclick="loginWithMicrosoft()" class="w-full py-4 px-6 bg-slate-900 hover:bg-black text-white text-sm font-semibold rounded-2xl shadow-lg shadow-slate-900/15 flex items-center justify-center space-x-3 transition-all duration-300 active:scale-[0.98]">
                <svg class="w-5 h-5" viewBox="0 0 21 21">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                <span>Acceder con Microsoft 365</span>
            </button>
            <p class="text-[11px] text-slate-400 mt-6">Acceso restringido exclusivamente a personal autorizado</p>
        </div>
    </div>

    <!-- ================= VISTA PRINCIPAL ================= -->
    <div id="appView" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="apple-glass border-b border-slate-200/80 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-blue-500/20">
                        U
                    </div>
                    <div>
                        <span class="font-bold text-slate-900 text-base tracking-tight block">UPANA Cloud Hub</span>
                        <span id="userEmailBadge" class="text-xs text-slate-500 font-medium">Conectado</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="openFolderModal()" class="inline-flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-2xs">
                        <i class="fa-solid fa-folder-plus text-blue-600"></i>
                        <span>Nueva Carpeta</span>
                    </button>
                    <button onclick="openLinkModal()" class="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nuevo Vínculo</span>
                    </button>
                    <div class="h-5 w-px bg-slate-200 mx-1"></div>
                    <button onclick="logout()" class="text-slate-400 hover:text-red-600 p-2.5 rounded-xl hover:bg-red-50 transition-all" title="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Contenido -->
        <main class="max-w-7xl mx-auto px-6 py-10 flex-1 w-full">
            <!-- Barra de Búsqueda y Selector de Carpetas Limpio -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-magnifying-glass text-sm"></i></span>
                    <input type="text" id="searchInput" oninput="filterLinks()" placeholder="Buscar Excel, OneDrive, reportes..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200/90 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-2xs transition-all">
                </div>
            </div>

            <!-- Menú Horizontal de Categorías (Evita ruido visual y muestra por pestañas) -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Filtrar por Carpeta</h3>
                    <span id="folderCountBadge" class="text-xs text-slate-400 font-medium"></span>
                </div>
                <div id="categoryFilters" class="flex items-center gap-2.5 overflow-x-auto pb-2">
                    <!-- Inyectado por JS -->
                </div>
            </div>

            <div id="loadingState" class="text-center py-20">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-3xl mb-3"></i>
                <p class="text-slate-500 text-sm">Cargando recursos desde Firebase...</p>
            </div>

            <div id="contentContainer" class="space-y-10 hidden"></div>
        </main>
    </div>

    <!-- MODAL NUEVO VÍNCULO -->
    <div id="linkModal" class="hidden fixed inset-0 bg-slate-950/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 id="linkModalTitle" class="text-xl font-bold text-slate-900">Agregar Nuevo Vínculo</h3>
                <button onclick="closeLinkModal()" class="text-slate-400 hover:text-slate-700 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="linkForm" onsubmit="saveLink(event)" class="space-y-5">
                <input type="hidden" id="linkId">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Título del Enlace</label>
                    <input type="text" id="linkTitle" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" placeholder="Ej. Matriz de Admisiones 2026">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">URL / Enlace (Excel, OneDrive, etc.)</label>
                    <input type="url" id="linkUrl" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" placeholder="https://onedrive.live.com/...">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Carpeta</label>
                        <select id="linkFolder" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Icono Visual</label>
                        <select id="linkIcon" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                            <option value="fa-file-excel">Excel / Hoja de Cálculo</option>
                            <option value="fa-cloud">OneDrive / Nube</option>
                            <option value="fa-folder-open">Carpeta General</option>
                            <option value="fa-file-lines">Documento / Word</option>
                            <option value="fa-globe">Sitio Web / Portal</option>
                            <option value="fa-chart-pie">Reporte / Dashboard</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeLinkModal()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md transition">Guardar Vínculo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL NUEVA CARPETA -->
    <div id="folderModal" class="hidden fixed inset-0 bg-slate-950/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-900">Nueva Carpeta</h3>
                <button onclick="closeFolderModal()" class="text-slate-400 hover:text-slate-700 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveFolder(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Nombre de la Carpeta</label>
                    <input type="text" id="folderNameInput" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" placeholder="Ej. Admisiones 2026">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeFolderModal()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md transition">Crear Carpeta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA Y SEGURIDAD -->
    <script>
        const ALLOWED_EMAILS = [
            "nozuna@upana.edu.gt",
            "ccoyoy@upana.edu.gt",
            "jmjuarez@upana.edu.gt"
        ];

        let folders = [];
        let links = [];
        let currentFilter = 'all';

        window.addEventListener('firebase-ready', () => {
            window.onAuthStateChanged(window.auth, async (user) => {
                if (user) {
                    const userEmail = (user.email || "").toLowerCase();
                    
                    if (!ALLOWED_EMAILS.includes(userEmail)) {
                        alert("Acceso denegado. Tu cuenta de correo no está autorizada para ingresar a este portal.");
                        await window.signOut(window.auth);
                        return;
                    }

                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('appView').classList.remove('hidden');
                    document.getElementById('userEmailBadge').innerText = userEmail;
                    await loadDataFromFirebase();
                } else {
                    document.getElementById('loginView').classList.remove('hidden');
                    document.getElementById('appView').classList.add('hidden');
                }
            });
        });

        async function loginWithMicrosoft() {
            try {
                document.getElementById('loginError').classList.add('hidden');
                await window.signInWithPopup(window.auth, window.provider);
            } catch (error) {
                console.error("Error en autenticación:", error);
                const errDiv = document.getElementById('loginError');
                errDiv.innerText = "Error al autenticar: " + error.message;
                errDiv.classList.remove('hidden');
            }
        }

        async function logout() {
            await window.signOut(window.auth);
        }

        async function loadDataFromFirebase() {
            try {
                const folderSnap = await window.getDocs(window.collection(window.db, "upana_central_enlaces"));
                
                folders = [];
                links = [];

                folderSnap.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (docSnap.id === "config_folders" && data.list) {
                        folders = data.list;
                    } else if (docSnap.id !== "config_folders") {
                        links.push({ id: docSnap.id, ...data });
                    }
                });

                // Si no hay carpetas definidas en Firebase, iniciamos completamente vacías (sin basura de prueba)
                if (!folders.includes("General") && folders.length === 0) {
                    folders = ["General"];
                    await window.setDoc(window.doc(window.db, "upana_central_enlaces", "config_folders"), { list: folders });
                }

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('contentContainer').classList.remove('hidden');
                renderApp();
            } catch (error) {
                console.error("Error al cargar datos:", error);
                document.getElementById('loadingState').innerHTML = `<p class="text-red-500 font-medium">Error al sincronizar con Firebase.</p>`;
            }
        }

        function renderApp() {
            renderCategoryFilters();
            renderFolderSelect();
            renderLinks();
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            document.getElementById('folderCountBadge').innerText = `${folders.length} carpetas activas`;

            let html = `
                <button onclick="filterCategory('all')" id="cat-all" class="category-pill ${currentFilter === 'all' ? 'bg-slate-900 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'} text-xs font-semibold px-4 py-2.5 rounded-xl transition-all whitespace-nowrap flex items-center space-x-2">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Todos los Recursos</span>
                </button>
            `;
            
            folders.forEach(folder => {
                const isActive = currentFilter === folder;
                const count = links.filter(l => l.folder === folder).length;
                html += `
                    <button onclick="filterCategory('${folder}')" id="cat-${folder}" class="category-pill ${isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-600/25' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'} text-xs font-semibold px-4 py-2.5 rounded-xl transition-all whitespace-nowrap flex items-center space-x-2">
                        <i class="fa-solid fa-folder"></i>
                        <span>${folder}</span>
                        <span class="${isActive ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-600'} text-[10px] px-1.5 py-0.2 rounded-full">${count}</span>
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function filterCategory(category) {
            currentFilter = category;
            renderCategoryFilters();
            renderLinks();
        }

        function renderFolderSelect() {
            const select = document.getElementById('linkFolder');
            select.innerHTML = '';
            folders.forEach(folder => {
                select.innerHTML += `<option value="${folder}">${folder}</option>`;
            });
        }

        function renderLinks() {
            const container = document.getElementById('contentContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            let filtered = links.filter(link => {
                const matchesSearch = link.title.toLowerCase().includes(searchQuery) || link.folder.toLowerCase().includes(searchQuery);
                const matchesCategory = currentFilter === 'all' || link.folder === currentFilter;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24 bg-white/80 backdrop-blur-md rounded-3xl border border-slate-200 shadow-2xs">
                        <div class="text-slate-300 text-5xl mb-4"><i class="fa-regular fa-folder-open"></i></div>
                        <p class="text-slate-700 font-semibold text-base">No hay vínculos en esta vista.</p>
                        <p class="text-slate-400 text-xs mt-1">Usa el botón "Nuevo Vínculo" para agregar enlaces de Excel o OneDrive.</p>
                    </div>`;
                return;
            }

            const groups = {};
            filtered.forEach(link => {
                if (!groups[link.folder]) groups[link.folder] = [];
                groups[link.folder].push(link);
            });

            let html = '';
            for (const [folderName, folderLinks] of Object.entries(groups)) {
                html += `
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
                        <div class="bg-gradient-to-r from-slate-50 to-blue-50/30 px-8 py-5 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-sm shadow-md shadow-blue-600/20"><i class="fa-solid fa-folder-closed"></i></span>
                                <div>
                                    <h2 class="font-bold text-slate-900 text-base">${folderName}</h2>
                                    <p class="text-xs text-slate-400">Carpeta institucional centralizada</p>
                                </div>
                                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">${folderLinks.length} enlaces</span>
                            </div>
                            <button onclick="deleteFolder('${folderName}')" class="text-slate-400 hover:text-red-600 text-xs transition p-2.5 rounded-xl hover:bg-red-50" title="Eliminar Carpeta"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                `;

                folderLinks.forEach((link) => {
                    let iconColor = "bg-emerald-50 text-emerald-600 border border-emerald-100";
                    if(link.icon.includes('cloud')) iconColor = "bg-sky-50 text-sky-600 border border-sky-100";
                    if(link.icon.includes('globe')) iconColor = "bg-indigo-50 text-indigo-600 border border-indigo-100";
                    if(link.icon.includes('chart')) iconColor = "bg-amber-50 text-amber-600 border border-amber-100";
                    if(link.icon.includes('lines')) iconColor = "bg-blue-50 text-blue-600 border border-blue-100";

                    html += `
                        <div class="apple-card group relative bg-slate-50/60 hover:bg-white border border-slate-200/80 rounded-2xl p-5 flex flex-col justify-between shadow-2xs">
                            <div>
                                <div class="flex items-start justify-between mb-4">
                                    <div class="w-12 h-12 rounded-2xl ${iconColor} flex items-center justify-center text-lg shadow-xs">
                                        <i class="fa-solid ${link.icon}"></i>
                                    </div>
                                    <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onclick="editLink('${link.id}')" class="text-slate-400 hover:text-blue-600 p-2 rounded-xl hover:bg-blue-50 transition" title="Editar"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button onclick="deleteLink('${link.id}')" class="text-slate-400 hover:text-red-600 p-2 rounded-xl hover:bg-red-50 transition" title="Eliminar"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </div>
                                <h3 class="font-bold text-slate-900 text-sm mb-1 line-clamp-2 tracking-tight">${link.title}</h3>
                                <p class="text-xs text-slate-400 truncate mb-6">${link.url}</p>
                            </div>
                            <a href="${link.url}" target="_blank" class="inline-flex items-center justify-center space-x-2 w-full bg-white hover:bg-blue-600 border border-slate-200 hover:border-blue-600 text-slate-700 hover:text-white text-xs font-semibold py-3 px-4 rounded-xl transition-all shadow-2xs">
                                <span>Abrir recurso</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        function filterLinks() { renderLinks(); }

        function openLinkModal() {
            document.getElementById('linkModalTitle').innerText = "Agregar Nuevo Vínculo";
            document.getElementById('linkForm').reset();
            document.getElementById('linkId').value = "";
            document.getElementById('linkModal').classList.remove('hidden');
        }

        function closeLinkModal() { document.getElementById('linkModal').classList.add('hidden'); }
        function openFolderModal() { document.getElementById('folderNameInput').value = ""; document.getElementById('folderModal').classList.remove('hidden'); }
        function closeFolderModal() { document.getElementById('folderModal').classList.add('hidden'); }

        async function saveLink(e) {
            e.preventDefault();
            const id = document.getElementById('linkId').value || "link_" + Date.now();
            const title = document.getElementById('linkTitle').value;
            const url = document.getElementById('linkUrl').value;
            const folder = document.getElementById('linkFolder').value;
            const icon = document.getElementById('linkIcon').value;

            const linkData = { title, url, folder, icon };
            await window.setDoc(window.doc(window.db, "upana_central_enlaces", id), linkData);
            
            closeLinkModal();
            await loadDataFromFirebase();
        }

        async function editLink(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            document.getElementById('linkModalTitle').innerText = "Editar Vínculo";
            document.getElementById('linkId').value = link.id;
            document.getElementById('linkTitle').value = link.title;
            document.getElementById('linkUrl').value = link.url;
            document.getElementById('linkFolder').value = link.folder;
            document.getElementById('linkIcon').value = link.icon;
            document.getElementById('linkModal').classList.remove('hidden');
        }

        async function deleteLink(id) {
            if (confirm("¿Deseas eliminar este vínculo de Firebase?")) {
                await window.deleteDoc(window.doc(window.db, "upana_central_enlaces", id));
                await loadDataFromFirebase();
            }
        }

        async function saveFolder(e) {
            e.preventDefault();
            const folderInputVal = document.getElementById('folderNameInput').value.trim();
            if (folderInputVal && !folders.includes(folderInputVal)) {
                folders.push(folderInputVal);
                await window.setDoc(window.doc(window.db, "upana_central_enlaces", "config_folders"), { list: folders });
                closeFolderModal();
                await loadDataFromFirebase();
            } else {
                alert("La carpeta ya existe o no es válida.");
            }
        }

        async function deleteFolder(folderName) {
            if (confirm(`¿Deseas eliminar la carpeta "${folderName}" y sus enlaces asociados?`)) {
                folders = folders.filter(f => f !== folderName);
                await window.setDoc(window.doc(window.db, "upana_central_enlaces", "config_folders"), { list: folders });
                
                for (const link of links.filter(l => l.folder === folderName)) {
                    await window.deleteDoc(window.doc(window.db, "upana_central_enlaces", link.id));
                }

                if (currentFilter === folderName) currentFilter = 'all';
                await loadDataFromFirebase();
            }
        }
    </script>
</body>
</html>
